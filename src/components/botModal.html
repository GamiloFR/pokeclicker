<div class="modal noselect fade" id="botModal" tabindex="-1" role="dialog" aria-labelledby="botModalLabel">
    <div class="modal-dialog modal-dialog-scrollable modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header" style='justify-content: space-around;'>
                <h5 class="modal-title">Bot</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

            <div class="modal-body p-0">
                <table class="table table-striped table-hover m-0">
                    <tbody data-bind="foreach: Bot.settings">
                        <tr data-bind="template: { name: $data.template, data: $data }"></tr>
                    </tbody>
                </table>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-danger" data-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-success" onclick="Bot.start()" data-bind="enable: Bot.canStart()" data-dismiss="modal">Start</button>
            </div>
        </div>
    </div>
</div>

<script type="text/html" id="BotSelectSetting">
    <td class="p-2">
        <label class="m-0" data-bind="{ text: description, attr: { for: name } }">Label</label>
    </td>
    <td class="p-0">
        <select class="form-control" data-bind="value: observable, attr: { id: name }">
            <!-- ko foreach: options -->
            <option data-bind="text: text, value: value"></option>
            <!-- /ko -->
            <!-- ko foreach: groups -->
            <optgroup data-bind="foreach: options, attr: { label }">
                <option data-bind="text: text, value: value"></option>
            </optgroup>
            <!-- /ko -->
        </select>
    </td>
</script>

<script type="text/html" id="BotOverlay">
    <div id="botOverlay">
        <span>Feature blocked, the bot has an active task</span>
        <button class="btn btn-danger" onclick="Bot.stop()">Stop active task</button>
    </div>
</script>

<script type="text/javascript">
    Bot.initialize();

    const addBlocker = (id, blockCondition) => {
        const container = document.getElementById(id);
        const childs = Array.from(container.childNodes);

        const blocker = document.createElement('knockout');
        blocker.setAttribute('data-bind', `template: { name: \'BotOverlay\', if: ${blockCondition} }`);
        childs.unshift(blocker);

        container.replaceChildren(...childs);
    }

    // Blockers
    addBlocker('battleContainer', 'Bot.blockers.route.isBlocked() || Bot.blockers.gym.isBlocked() || Bot.blockers.dungeon.isBlocked()');
    addBlocker('dungeonMap', 'Bot.blockers.dungeon.isBlocked()');

    // Map blocker
    const map = document.getElementById('map');
    const mapContainer = map.parentNode;

    const container = document.createElement('div');
    mapContainer.replaceChild(container, map);

    const mapBlocker = document.createElement('knockout');
    mapBlocker.setAttribute('data-bind', 'template: { name: \'BotOverlay\', if: Bot.blockers.map.isBlocked() }')
    container.append(mapBlocker, map);

</script>
