<div class="modal noselect fade" id="companionModal" tabindex="-1" role="dialog" aria-labelledby="companionModalLabel">
    <div class="modal-dialog modal-dialog-scrollable modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header" style='justify-content: space-around;'>
                <h5 class="modal-title">Companion</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

            <div class="modal-body p-0">
                <ul class="nav nav-tabs nav-fill">
                    <li class="nav-item"><a class="nav-link active" href="#companion-cheats" data-toggle="tab">Cheats</a></li>
                    <li class="nav-item"><a class="nav-link" href="#companion-bot" data-toggle="tab">Bot</a></li>
                </ul>

                <div class="tab-content">
                    <!-- ko foreach: { data: CompanionSettings.tabs, as: 'tab' } -->
                    <div class="tab-pane" data-bind="attr: { id }, class: $index() === 0 ? 'active' : ''">
                        <table class="table table-striped table-hover m-0">
                            <tbody data-bind="foreach: list ">
                                <tr data-bind="template: { name: $data.template, data: $data }"></tr>
                            </tbody>
                        </table>
                    </div>
                    <!-- /ko -->
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/html" id="CompanionBooleanSetting">
    <td class="p-2">
        <label class="mb-0" data-bind="text: $data.description, attr: { for: $data.name }">Description</label>
    </td>
    <td class="p-2">
        <input
            type="checkbox"
            class="clickable"
            data-bind="checked: $data.value, attr: { name: $data.name, id: $data.name }"
            onchange="CompanionSettings.setSetting(this.name, this.checked)"
        />
    </td>
</script>

<script type="text/javascript">
    Companion.initialize();
</script>

<!-- Bot Modal -->
@import "botModal.html"
