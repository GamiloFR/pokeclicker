<div
    id="scripts"
    class="card sortable border-secondary mb-3"
    data-bind="visible: player.regionStarters[GameConstants.Region.kanto]() != GameConstants.Starter.None"
>
    <div class="card-header p-0" data-toggle="collapse" href="#scriptsBody">
        <span>Scripts</span>
    </div>
    <img
        class="clickable" src="assets/images/fa-cog.svg"
        style="position: absolute; right: 0px; top: 0px; width: auto; height: 41px; padding: 8px; padding-right: 4px;"
        data-toggle="modal"
        href="#scriptsSettingsModal"
    />
    <div id="scriptsBody" class="card-body p-0 show">
        <div class="table-responsive d-flex flex-column">
            <div class="flex-grow-1 flex-shrink-1" style="overflow: auto;">
                <table class="table table-sm m-0">
                    <tbody data-bind="foreach: Scripts.list">
                        <tr data-bind="visible: $data.isUnlocked()">
                            <td class="p-2">
                                <label class="m-0" data-bind="attr: { for: $data.id }, text: `${$data.name}:`">
                                    script name
                                </label>
                            </td>
                            <td class="p-2">
                                <input
                                    class="clickable"
                                    type="checkbox"
                                    data-bind="checked: $data.isActive, attr: { id: $data.id }"
                                    onchange="Scripts.setScript(this.id, this.checked)"
                                />
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div
    class="modal noselect fade"
    id="autoFarmSetupModal"
    tabindex="-1"
    role="dialog"
    aria-labelledby="autofarmSetupModalLabel"
>
    <div class="modal-dialog modal-dialog-scrollable modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header" style='justify-content: space-around;'>
                <h5 class="modal-title">Auto-farm setup</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body p-0">
                <div id="farmView" class="justify-content-center no-select row">
                    <div class="col-12 col-lg-4">
                        <div class="input-group input-group-sm mt-1">
                            <input
                                type="text"
                                class="form-control"
                                placeholder="Search"
                                data-bind="textInput: FarmController.berryListSearch"
                            />
                            <div class="input-group-append">
                                <span
                                    class="input-group-text justify-content-center"
                                    style="min-width: 32px; cursor: pointer;"
                                    data-bind="visible: FarmController.berryListSearch().length, click: () =>  FarmController.berryListSearch('')"
                                >✕</span>
                                <span
                                    class="input-group-text justify-content-center" style="min-width: 32px;" data-bind="tooltip: {
                                                    title: 'Search for berries by name. Use a space to search for multiple berries.',
                                                    trigger: 'hover',
                                                    placement: 'right',
                                                }"
                                >ⓘ</span>
                            </div>
                        </div>
                        <ul id="seedList" class="list-group p-0">
                            <!-- ko foreach: FarmController.getUnlockedBerryListWithIndex() -->
                            <li
                                class="list-group-item list-group-item-action seed-list-item p-2 d-flex align-items-center"
                                data-bind="click: function() { AutoFarmScriptController.selectedBerry($data); }, css: { 'active': AutoFarmScriptController.selectedBerry() === $data }"
                            >
                                <img
                                    src="" height="28px"
                                    data-bind="attr:{ src: FarmController.getBerryImage($data) }, css: {'berryLocked': !App.game.farming.unlockedBerries[$data]() }"
                                    alt="berry"
                                >
                                <span data-bind="text: App.game.farming.unlockedBerries[$data]() ? BerryType[$data] : '???'"></span>
                                <span
                                    class="flex-grow-1 text-right"
                                    data-bind="text: App.game.farming.berryList[$data]().toLocaleString('en-US')"
                                ></span>
                            </li>
                            <!-- /ko -->
                        </ul>

                        <div class="row justify-content-center align-items-center">
                            <div class="col-4 pr-0">
                                <button
                                    class="btn btn-block btn-secondary"
                                    onclick="FarmController.navigateLeft()"
                                    data-bind="disable: FarmController.navigateIndex() === 0,
                                                        css: { disabled: FarmController.navigateIndex() === 0 }"
                                >
                                    <img
                                        src="assets/images/arrow.svg"
                                        style="transform: scaleX(-1);"
                                        height="20"
                                        alt="arrow"
                                    >
                                </button>
                            </div>
                            <div
                                class="col-4"
                                data-bind="text: FarmController.navigateIndex()+1 + '/' + (FarmController.numberOfTabs())"
                            ></div>
                            <div class="col-4 pl-0">
                                <button
                                    class="btn btn-block btn-secondary"
                                    onclick="FarmController.navigateRight()"
                                    data-bind="disable: FarmController.navigateIndex() === FarmController.numberOfTabs() - 1,
                                                        css: { disabled: FarmController.navigateIndex() === FarmController.numberOfTabs() - 1 }"
                                >
                                    <img src="assets/images/arrow.svg" height="20" alt="arrow">
                                </button>
                            </div>
                        </div>

                        <div class="row justify-content-center py-1">
                            <div class="col-6 pr-0">
                                <button
                                    class="btn btn-primary btn-block"
                                    data-bind="click: function(){AutoFarmScriptController.plantAll()}"
                                >
                                    Plant All
                                </button>
                            </div>
                            <div class="col-6 pl-0">
                                <button
                                    class="btn btn-danger btn-block"
                                    data-bind="click: function(){AutoFarmScriptController.removeAll()}"
                                >
                                    Remove All
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="col-12 col-lg-8">
                        <div
                            id="plotList"
                            class="row"
                            data-bind="foreach: AutoFarmScriptController.plotList, css: { ShiftPressed: GameController.keyHeld.Shift() }"
                        >
                            <!-- ko if: $index() % GameConstants.FARM_PLOT_WIDTH == 0 -->
                            <div class="w-100"></div>
                            <!-- /ko -->
                            <div class="plot col" data-bind="css: { plotLocked : !$data.isUnlocked }">
                                <div class="plot-content" data-bind="class: FarmController.calculateCssClass($data)">
                                    <div class="plotImage">
                                        <img
                                            style="width: 100%;" src="assets/images/farm/soil.png"
                                            data-bind="class: FarmController.calcMulchClass($data)"
                                            alt="soil"
                                        >
                                        <!-- ko if: !$data.isUnlocked -->
                                        <div
                                            class="plotButton plotLockHover" data-bind="tooltip: {
                                              title: `Unlock this plot in the Farm`,
                                              placement: 'bottom',
                                              trigger: 'hover'
                                            }" onclick="FarmController.openFarmModal()"
                                        >
                                            <img alt="lock" class="lock" src="assets/images/breeding/lock.svg">
                                        </div>
                                        <!-- /ko -->
                                        <div
                                            class="plotButton"
                                            data-bind="ifnot: $data.isEmpty(),
                                                    click: function(data, event){AutoFarmScriptController.plotClick($index())},
                                                    tooltip: {title: $data.tooltip(), trigger: 'hover', animation: false, html: true}"
                                        >
                                            <img
                                                width="100%" height="100%" src=""
                                                style="width: 68.75%; max-height: 100%; image-rendering: pixelated;"
                                                data-bind="attr:{ src: `assets/images/farm/${BerryType[$data.berry]}TreeBerry.png` }"
                                            >
                                        </div>
                                        <!-- ko if: $data.isSafeLocked -->
                                        <img class="plotSafeLockIcon" src="assets/images/farm/plotSafeLock.svg">
                                        <!-- /ko -->

                                        <span
                                            class="position-absolute border border-2 border-dark rounded-circle bg-success"
                                            style="bottom: 3px; left: 3px; padding: 0.4rem; pointer-events: none;"
                                            data-bind="visible: App.game.farming.possiblePlotMutations()[$index()].length > 0"
                                        ></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div
    class="modal noselect fade"
    id="scriptsSettingsModal"
    tabindex="-1"
    role="dialog"
    aria-labelledby="scriptsSettingsModalLabel"
>
    <div class="modal-dialog modal-dialog-scrollable modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header" style='justify-content: space-around;'>
                <h5 class="modal-title">Scripts Settings</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body p-0">
                <table class="table table-striped table-hover m-0" data-bind="foreach: ScriptsSettings.groups">
                    <thead>
                        <tr>
                            <th colspan="2" data-bind="text: $data.name">Group name</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- ko foreach: $data.items -->
                        <tr data-bind="visible: $data.isVisible">
                            <td class="p-2" style="width: 60%" data-bind="text: `${$data.name}:`"></td>
                            <td
                                class="p-0 vertical-middle"
                                data-bind="template: { name: $data.template, data: $data }"
                            ></td>
                        </tr>
                        <!-- /ko -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script type="text/html" id="SelectScriptSettingTemplate">
    <select
        class="form-control"
        onchange="ScriptsSettings.setSetting(this.id, this.value)"
        data-bind="foreach: $data.options, attr: { id: $data.id }"
    >
        <option data-bind="text: $data.name, value: $data.value, attr: { selected: $parent.value == $data.value}"></option>
    </select>
</script>

<script type="text/html" id="NumberScriptSettingTemplate">
    <input
        type="number"
        class="form-control"
        onchange="ScriptsSettings.setSetting(this.id, this.value)"
        data-bind="attr: { id: $data.id }, value: $data.value"
    />
</script>

<script type="text/html" id="BooleanScriptSettingTemplate">
    <input
        type="checkbox"
        class="clickable"
        onchange="ScriptsSettings.setSetting(this.id, this.checked)"
        data-bind="attr: { id: $data.id }, checked: $data.value"
    />
</script>

<script type="text/html" id="ButtonScriptSettingTemplate">
    <button class="btn btn-primary" type="button" data-toggle="modal" data-bind="attr: { 'data-target': $data.target }">
        Open modal
    </button>
</script>
